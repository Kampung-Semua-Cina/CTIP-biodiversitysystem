# CTIP-50 / F-14: the team's own MQTT broker (replaces broker.hivemq.com:1883).
# TLS only (port 8883), a login for every device, and each device may only
# use its own topic (acl). Run from this folder: mosquitto -c mosquitto.conf -v
allow_anonymous false
password_file passwd
acl_file acl

listener 8883
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
tls_version tlsv1.2
