openapi: 3.1.0

info:
  title: Smart Ground-Truthing & Digital Biodiversity API
  version: 0.1.0
  description: |
    API contract skeleton for the Niah National Park biodiversity system.

    **Who uses what**
    - **Visitors** (not logged in): only the `/public/...` endpoints.
    - **Botanists**: register specimens, record observations, upload photos, sync offline work.
    - **Officers**: review observations, manage species, QR tags, sensors and alerts.
    - **Admins**: everything, plus user management.

    **Auth:** sign in with `POST /auth/sign-in`, then send the access token it
    returns as `Authorization: Bearer <token>`. Before it expires (`expires_at`),
    swap the refresh token for a new session with `POST /auth/refresh`. The web
    and mobile apps only talk to this API; the API calls Supabase Auth for them.
    The one exception is photos: the API hands out short-lived Supabase Storage
    links, which the apps load directly.
    Sensor devices and the MQTT bridge use the `X-Sensor-Key` header instead.

    **Sensor data flow**
    - **Readings go over MQTT, not HTTP.** Each node publishes one reading as JSON
      to the topic `nodes/{node_id}/telemetry` on the Mosquitto broker (TLS, QoS 1).
      The payload is one `TelemetryReadingInput` object.
    - **The MQTT bridge** (a small backend subscriber) forwards those readings to
      `POST /telemetry`. That keeps validation, storage and alert rules in one
      place. The sensor simulator may call `POST /telemetry` directly.
    - **The prototype node** is an ESP32 with a DHT11 (temperature and
      humidity), a YL-69 (soil moisture) and an HC-SR04 (ultrasonic distance).
      It has no camera (images come from a laptop webcam, below) and no GPS
      module, so its location is recorded when the node is registered
      (`SensorNodeInput.lat` / `lng`). Readings may still carry `lat` / `lng`
      for nodes that do have GPS.
    - **Motion** is detected with the HC-SR04. The node samples distance often
      between readings and sets `motion_detected` when the distance changes by
      more than its threshold, which suggests someone is near or touching the
      plant. `distance_cm` is sent as well, so the server can check it.
    - **Images come from a laptop webcam**, not the ESP32. A capture script on
      the laptop takes a photo when the node reports motion and sends the JPEG
      to `POST /sensor-nodes/{id}/images` over HTTP, because MQTT is unsuited
      to large payloads.

    This is a contract only: endpoints and data shapes are agreed here first,
    then implemented by the backend and consumed by the web/mobile apps.

servers:
  - url: http://localhost:8000/v1
    description: Local development
  - url: https://api.example.com/v1
    description: Production (placeholder — replace when deployed)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Signing in and out, sessions and passwords (the API calls Supabase Auth)
  - name: Public
    description: Visitor-facing, no login required
  - name: Profiles
  - name: QR Tags
  - name: Species
  - name: Specimens
  - name: Observations
  - name: Photos
  - name: Reviews
  - name: Comments
  - name: Sync
  - name: Sensors
  - name: Alerts
  - name: Discussions
    description: Discussion board threads shared with people or role groups
  - name: Notifications
  - name: Reports
    description: File exports for officers and admins
  - name: Map
    description: Distribution map data, with endangered locations reduced by role

paths:

  # ------------------------------------------------------------------ Health
  /health:
    get:
      tags: [Public]
      operationId: getHealth
      summary: Is the API up, and how busy is the database
      description: >
        Never queries the database, so a busy database does not make the API
        look down. `db` comes from the API's recent database calls:
        `poll_after_ms` is how long the apps should wait between live-update
        polls (5 s when the database is quick, up to 60 s when it is busy).
      security: []
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  time: { type: string, format: date-time }
                  db: { $ref: '#/components/schemas/DbLoad' }

  # ------------------------------------------------------------------ Auth
  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in with email and password
      description: |
        At most 10 sign-in attempts per caller address every 5 minutes; more get 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, description: Trimmed and lower-cased }
                password: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: INVALID_CREDENTIALS (wrong email or password)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: EMAIL_NOT_CONFIRMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '502': { $ref: '#/components/responses/AuthUnavailable' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Swap a refresh token for a new session
      description: Each refresh token works once; store the new one from the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: SESSION_ENDED (signed out, used already, or expired; sign in again)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End this session
      description: |
        Send the access token if you have one; its refresh token stops working.
        The access token itself stays valid until it expires, so the app deletes it.
        Always 204.
      security: [{}, { bearerAuth: [] }]
      responses:
        '204': { description: Signed out }

  /auth/password-reset:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Email a password-reset link
      description: |
        Always 202, whether or not the address has an account. The link opens the
        website signed in, which then calls `POST /me/password` without a current password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean, const: true }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: TOO_MANY_ATTEMPTS from this address, or EMAIL_RATE_LIMIT (Supabase's email limit for the whole project; details holds an EmailLimit)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ Public
  /public/species:
    get:
      tags: [Public]
      operationId: listPublicSpecies
      summary: List published species (visitor catalogue)
      description: Also the botanist's species lookup on mobile, since GET /species is Officer/Admin only.
      security: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Family'
        - $ref: '#/components/parameters/ConservationStatus'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published species
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicSpecies' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /public/species/{id}:
    get:
      tags: [Public]
      operationId: getPublicSpecies
      summary: Get one published species with its gallery
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Species detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSpecies' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/tags/{qrId}:
    get:
      tags: [Public]
      operationId: getPublicPlantByTag
      summary: The plant on a scanned QR tag (visitor QR page, CTIP-33)
      description: >
        One plant that is approved on a published species, with that species'
        visitor fields. Unknown, unused, unapproved and deleted tags all answer
        the same 404. **Endangered locations (threat T13):** the coordinates are
        snapped to the centre of a 0.01 degree grid square and
        `location_reduced` is true; a plant with no GPS fix has null
        coordinates. Limited to 30 lookups a minute per caller address (429
        with `Retry-After`).
      security: []
      parameters:
        - $ref: '#/components/parameters/QrId'
      responses:
        '200':
          description: The plant and its species
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPlant' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  # ---------------------------------------------------------------- Profiles
  /public/workspace:
    get:
      tags: [Public]
      operationId: getPublicWorkspace
      summary: Everything the visitor pages show, in one call
      description: >
        Published, non-deleted species and their photos (RLS "public read").
        No plants, observations or other tables: those lists come back empty.
      security: []
      responses:
        '200':
          description: Species and species photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  species:
                    type: array
                    items: { $ref: '#/components/schemas/Species' }
                  species_media:
                    type: array
                    items: { $ref: '#/components/schemas/SpeciesMedia' }
                  unavailable:
                    type: array
                    items: { type: string }

  /workspace:
    get:
      tags: [Profiles]
      operationId: getWorkspace
      summary: The apps' start-up load and live-update poll (any staff role)
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: >
            The `cursor` from the previous answer. With it, only lists whose
            table changed since then are sent (`partial: true`), or none at
            all (`unchanged: true`). A missing, broken or old cursor (over 12
            hours, another user or role) gets a full load.
      description: >
        Every list the apps show, each holding what RLS lets this user read:
        species, species_media, qr_tags, specimens, observations,
        observation_photos (with signed links), observation_reviews,
        observation_comments, alerts, alert_notes, sensor_nodes, notifications,
        audit_logs, profiles and zones (officer and admin only), discussions,
        discussion_audience, discussion_posts, and directory (active accounts'
        id, full_name, username and role, for sharing and @mentions). If qr_tags, specimens or observations cannot
        be read the request fails with 500; any other list that fails comes
        back empty and is named in `unavailable`.


        **Endangered locations (threat T13, CTIP-71):** for any role other
        than officer and admin, an endangered plant that the caller did not
        register has its `lat`/`lng` snapped to the 0.01 degree grid used by
        `/distribution`, `gps_accuracy_m` set to 1100 and `location_reduced`
        true. A plant whose species the caller cannot see counts as endangered.
      responses:
        '200':
          description: One array per table, plus `unavailable`
          content:
            application/json:
              schema:
                type: object
                properties:
                  specimens:
                    type: array
                    items: { $ref: '#/components/schemas/Specimen' }
                  unavailable:
                    type: array
                    items: { type: string }
                  partial: { type: boolean, description: 'true: only the lists that changed are sent; keep the others' }
                  unchanged: { type: boolean, description: 'true: nothing changed since the cursor' }
                  cursor: { type: string, description: Send back on the next poll }
                  poll_after_ms: { type: integer, description: How long to wait before the next poll }
                additionalProperties:
                  type: array
                  items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me:
    get:
      tags: [Profiles]
      operationId: getMyProfile
      summary: Get the logged-in user's profile and role
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profiles]
      operationId: updateMyProfile
      summary: Change your own name, username, phone or photo
      description: Role and active status are not changed here (admins use PATCH /profiles/{id}).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                full_name: { type: string, minLength: 1, maxLength: 200 }
                username:
                  type: string
                  pattern: '^[a-z0-9._]{3,20}$'
                  description: Stored lower case
                phone: { type: string, pattern: '^(\+?[0-9 -]{7,15})?$' }
                avatar_url: { type: [string, 'null'], maxLength: 3000000 }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: USERNAME_TAKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/password:
    post:
      tags: [Profiles]
      operationId: changeMyPassword
      summary: Change your own password
      description: |
        From the account page, send `current_password` too; a wrong one changes
        nothing (403 WRONG_PASSWORD). After a password-reset link, leave it out.
        Other sessions stay signed in until their tokens expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              additionalProperties: false
              properties:
                current_password: { type: string, minLength: 1, maxLength: 200 }
                new_password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: WRONG_PASSWORD, SIGN_IN_AGAIN, or your role is not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validation failed, SAME_PASSWORD or WEAK_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/AuthUnavailable' }

  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      summary: List users (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Profile' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Profiles]
      operationId: createProfile
      summary: Create an account with a role (admin)
      description: >
        Creates the Supabase Auth user and sets its profile. Without a
        password, a random one is set and the person is emailed a link to
        choose their own (`invited: true`). Needs "Allow new users to sign up"
        on in Supabase Auth, otherwise 503 SIGNUP_DISABLED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 200 }
                full_name: { type: string, minLength: 1, maxLength: 200 }
                role: { $ref: '#/components/schemas/Role' }
                username: { type: string, pattern: '^[a-z0-9._]{3,20}$' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Profile'
                  - type: object
                    properties:
                      invited: { type: boolean }
                      email_limit:
                        description: Only when the invitation email was refused by the email limit
                        allOf:
                          - $ref: '#/components/schemas/EmailLimit'
                          - type: object
                            properties:
                              message: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/EmailRateLimit' }
        '502':
          description: >
            PROFILE_NOT_SAVED: the sign-in account was made but its profile was
            not saved, so no invitation was sent. Do not create it again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            EMAIL_TAKEN or USERNAME_TAKEN. Checked before Supabase is asked
            (deleted and turned-off accounts included), so a refused attempt
            sends no email and uses none of the email limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: SIGNUP_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /profiles/{id}:
    patch:
      tags: [Profiles]
      operationId: updateProfile
      summary: Change a user's role or active status (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- QR Tags

    delete:
      tags: [Profiles]
      operationId: deleteProfile
      summary: Delete a user (admin), with 30 days to restore
      description: >
        Sets `deleted_at` and turns the account off at once, so the person
        cannot sign in. Within 30 days `POST /profiles/{id}/restore` undoes
        it. After that the sign-in account is removed for good; their field
        records are kept without an author, and discussion threads they
        started are removed. You cannot delete yourself or the last active admin.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted (restorable until `remove_at`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Profile'
                  - type: object
                    properties:
                      remove_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /profiles/{id}/restore:
    post:
      tags: [Profiles]
      operationId: restoreProfile
      summary: Undo a delete within 30 days (admin)
      description: The account stays turned off until an admin turns it on.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /qr-tags:
    get:
      tags: [QR Tags]
      operationId: listQrTags
      summary: List QR tags
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QrTagStatus' }
        - name: batch_label
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: QR tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/QrTag' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /qr-tags/batch:
    post:
      tags: [QR Tags]
      operationId: createQrTagBatch
      summary: Generate a print batch of new QR tags (officer/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count, batch_label]
              properties:
                count: { type: integer, minimum: 1, maximum: 500 }
                batch_label: { type: string, examples: ['2026-10-batch-A'] }
      responses:
        '201':
          description: Tags created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QrTag' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /qr-tags/{qrId}:
    get:
      tags: [QR Tags]
      operationId: getQrTag
      summary: Look up a QR tag (and its specimen, if assigned)
      parameters:
        - $ref: '#/components/parameters/QrId'
      responses:
        '200':
          description: QR tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrTag' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [QR Tags]
      operationId: deleteQrTag
      summary: Delete an unused tag (officer/admin)
      description: Only a tag that is `unassigned` and not on any plant. A tag on a plant is retired instead.
      parameters:
        - $ref: '#/components/parameters/QrId'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TAG_IN_USE (the tag is on a plant)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /qr-tags/{qrId}/retire:
    post:
      tags: [QR Tags]
      operationId: retireQrTag
      summary: Retire a tag so it can never be used again (officer/admin)
      parameters:
        - $ref: '#/components/parameters/QrId'
      responses:
        '200':
          description: The tag, now `retired`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrTag' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- Species
  /species:
    get:
      tags: [Species]
      operationId: listSpecies
      summary: List all species incl. unpublished (staff)
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Family'
        - $ref: '#/components/parameters/ConservationStatus'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - name: is_published
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Species
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Species' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Species]
      operationId: createSpecies
      summary: Create a species (officer/admin)
      description: >
        The client may send its own `id`. Sending the same `id` again (for example
        a retry after a dropped connection) returns the record already saved with
        200 instead of creating a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeciesCreate' }
      responses:
        '200':
          description: Already created earlier with this id; the saved record is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Species' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Species' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /species/{id}:
    get:
      tags: [Species]
      operationId: getSpecies
      summary: Get a species (staff view)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Species
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Species' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Species]
      operationId: updateSpecies
      summary: Update a species (officer/admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeciesUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Species' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Species]
      operationId: deleteSpecies
      summary: Soft-delete a species (sets is_deleted)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /species/{id}/publish:
    post:
      tags: [Species]
      operationId: setSpeciesPublished
      summary: Publish or unpublish a species for visitors
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_published]
              properties:
                is_published: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Species' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /species/{id}/restore:
    post:
      tags: [Species]
      operationId: restoreSpecies
      summary: Undo a soft delete (officer/admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The species, no longer deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Species' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /species/{id}/media:
    get:
      tags: [Species, Photos]
      operationId: listSpeciesMedia
      summary: List gallery images for a species
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Media
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SpeciesMedia' }
    post:
      tags: [Species, Photos]
      operationId: uploadSpeciesMedia
      summary: Upload a species photo with a caption (officer/admin)
      description: >
        The file is sent to the API, which checks its real type from the file's
        bytes (JPEG, PNG or WebP) and its size (at most 10 MB), removes location
        and other metadata (EXIF, XMP, text chunks), then stores it in the public
        species-media bucket as {species_id}/{media_id}.{ext}. Setting is_primary
        makes this the only cover photo of the species.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary, description: "JPEG, PNG or WebP, at most 10 MB" }
                caption: { type: string, minLength: 1, maxLength: 300 }
                credit: { type: string, minLength: 1, maxLength: 200 }
                is_primary: { type: boolean, default: false }
                sort_order: { type: integer, minimum: 0, maximum: 1000, default: 0 }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeciesMedia' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File larger than 10 MB (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Not a JPEG, PNG or WebP image (UNSUPPORTED_FILE_TYPE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /species/{id}/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Species, Photos]
      operationId: updateSpeciesMedia
      summary: Change a species photo's caption, credit, order or cover flag (officer/admin)
      description: >
        The file itself never changes; a new picture is a new upload. Setting
        is_primary makes this the only cover photo of the species.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                caption: { type: string, minLength: 1, maxLength: 300 }
                credit: { type: [string, 'null'], minLength: 1, maxLength: 200 }
                is_primary: { type: boolean }
                sort_order: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeciesMedia' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Species, Photos]
      operationId: deleteSpeciesMedia
      summary: Remove a species photo and its file (officer/admin)
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- Specimens
  /specimens:
    get:
      tags: [Specimens]
      operationId: listSpecimens
      summary: List specimens
      parameters:
        - name: species_id
          in: query
          schema: { type: string, format: uuid }
        - name: unresolved
          in: query
          description: Only specimens with no species_id yet
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Specimens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Specimen' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Specimens]
      operationId: registerSpecimen
      summary: Register a new specimen by scanning a QR tag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpecimenCreate' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Specimen' }
        '409':
          description: QR tag already assigned to another specimen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /specimens/by-qr/{qrId}:
    get:
      tags: [Specimens]
      operationId: getSpecimenByQr
      summary: Find the specimen attached to a scanned QR code
      description: >
        An endangered plant's exact spot is reduced as in GET /workspace (see
        `Specimen.location_reduced`), unless the caller is an officer or admin
        or registered the plant.
      parameters:
        - $ref: '#/components/parameters/QrId'
      responses:
        '200':
          description: Specimen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Specimen' }
        '404': { $ref: '#/components/responses/NotFound' }

  /specimens/{id}:
    get:
      tags: [Specimens]
      operationId: getSpecimen
      summary: Get one specimen
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Specimen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Specimen' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Specimens]
      operationId: updateSpecimen
      summary: Update a specimen (e.g. officer links it to a species)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpecimenUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Specimen' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------ Observations
  /observations:
    get:
      tags: [Observations]
      operationId: listObservations
      summary: List observations (botanists see their own; staff see all)
      description: >
        Officer review queue: `status=pending` (the same as `synced`, "Needs review"
        in the apps), oldest first. Botanists get only the observations they
        recorded, so they can follow the status of each submission.
      parameters:
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: '#/components/schemas/ObservationStatus'
              - { type: string, const: pending, description: Same as synced }
        - name: specimen_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Observations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Observation' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Observations]
      operationId: createObservation
      summary: Create an observation (id may be generated on the device)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Observation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /observations/{id}:
    get:
      tags: [Observations]
      operationId: getObservation
      summary: Get one observation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Observation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Observation' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Observations]
      operationId: updateObservation
      summary: Edit an observation (send current version; 409 if someone else changed it)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Observation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Observations]
      operationId: deleteObservation
      summary: Soft-delete a draft observation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /observations/{id}/submit:
    post:
      tags: [Observations]
      operationId: submitObservation
      summary: Submit a draft/returned observation for review
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Observation' }
        '409':
          description: Observation is not in a submittable state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /observations/{id}/photos:
    get:
      tags: [Photos]
      operationId: listObservationPhotos
      summary: List photos attached to an observation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Photos (each includes a short-lived signed view URL)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObservationPhoto' }
    post:
      tags: [Photos]
      operationId: createObservationPhotoUpload
      summary: Start a photo upload (returns signed upload URL)
      description: |
        1. Call this to get `upload.url`.
        2. PUT the image bytes to that URL.
        3. Call `/observations/{id}/photos/{photoId}/confirm`.

        The API also accepts the file directly as multipart/form-data: `file`, an
        optional `id`, an optional `caption`, and `traits` (repeat for each one).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: Upload slot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo: { $ref: '#/components/schemas/ObservationPhoto' }
                  upload: { $ref: '#/components/schemas/UploadTicket' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /observations/{id}/photos/{photoId}/confirm:
    post:
      tags: [Photos]
      operationId: confirmObservationPhoto
      summary: Mark a photo as uploaded after the file transfer finishes
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationPhoto' }
        '404': { $ref: '#/components/responses/NotFound' }

  /observations/{id}/reviews:
    get:
      tags: [Reviews]
      operationId: listObservationReviews
      summary: List review decisions for an observation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Review history, oldest first (every decision with reviewer and time)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      operationId: reviewObservation
      summary: Approve, return (request changes) or reject an observation (officer/admin)
      description: >
        Only an observation waiting for review (status synced) can be reviewed, and
        only at the version the reviewer looked at. The checks and the decision happen
        in one locked database step (public.review_observation), so a botanist's edit
        or a second reviewer cannot slip in between.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Review recorded; observation status updated; botanist notified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            VERSION_CONFLICT when observation_version is stale (botanist edited it since),
            WRONG_STATUS when the observation is not waiting for review (draft, or already reviewed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            VALIDATION_ERROR for a bad body or a missing reason, or SPECIES_REQUIRED when
            approving an observation whose plant is not linked to a species yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /observations/{id}/comments:
    get:
      tags: [Comments]
      operationId: listObservationComments
      summary: List comments on an observation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
    post:
      tags: [Comments]
      operationId: addObservationComment
      summary: Add a comment to an observation
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }

  # -------------------------------------------------------------------- Sync
  /sync:
    post:
      tags: [Sync]
      operationId: syncOfflineObservations
      summary: Upload observations recorded offline in one batch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
      responses:
        '200':
          description: Per-item results (some may conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }

  # ----------------------------------------------------------------- Sensors
  /sensor-nodes:
    get:
      tags: [Sensors]
      operationId: listSensorNodes
      summary: List sensor nodes (officer/admin)
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SensorNode' }
    post:
      tags: [Sensors]
      operationId: createSensorNode
      summary: Register a sensor node (admin only, CTIP-48)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorNodeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorNode' }

  /sensor-nodes/{id}:
    get:
      tags: [Sensors]
      operationId: getSensorNode
      summary: Get one sensor node (officer/admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorNode' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sensors]
      operationId: updateSensorNode
      summary: Update status or alert thresholds
      description: >
        Officers may change the alert limits (thresholds) only; anything else
        about a node is the admin's. The database enforces this too (migration
        20261105200000_sensor_nodes_admin_manage).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorNodeInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorNode' }

  /sensor-nodes/{id}/telemetry:
    get:
      tags: [Sensors]
      operationId: getNodeTelemetry
      summary: Readings for one node over a time range
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Readings, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TelemetryReading' }

  /telemetry:
    post:
      tags: [Sensors]
      operationId: ingestTelemetry
      summary: Store sensor readings (may create alerts)
      description: |
        Called by the MQTT bridge and the sensor simulator, not by the nodes
        themselves: nodes publish to MQTT (see "Sensor data flow" at the top).
      security:
        - sensorKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, readings]
              properties:
                node_id: { type: string, format: uuid }
                readings:
                  type: array
                  items: { $ref: '#/components/schemas/TelemetryReadingInput' }
      responses:
        '202': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sensor-nodes/{id}/images:
    get:
      tags: [Sensors]
      operationId: listNodeImages
      summary: Images captured by one node, newest first (officer/admin)
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SensorImage' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sensors]
      operationId: uploadNodeImage
      summary: Upload one JPEG for a node (e.g. when motion is detected)
      description: |
        Sent by the laptop webcam capture script that acts as the node's camera
        (the ESP32 node has no camera). The request body is the raw JPEG bytes,
        not JSON or multipart. The API stores the file in the private
        `sensor-images` bucket.
      security:
        - sensorKey: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: captured_at
          in: query
          description: When the image was taken. Defaults to the time of upload.
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              maxLength: 2097152
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Image is larger than 2 MB }
        '415': { description: Body is not image/jpeg }

  # ------------------------------------------------------------------ Alerts
  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: List alerts, filtered by status or severity (officer/admin)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: assigned_to_me
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /alerts/{id}:
    get:
      tags: [Alerts]
      operationId: getAlert
      summary: Get one alert (officer/admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '404': { $ref: '#/components/responses/NotFound' }

  /alerts/{id}/assign:
    post:
      tags: [Alerts]
      operationId: assignAlert
      summary: Assign an alert to a staff member
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigned_to]
              properties:
                assigned_to: { type: string, format: uuid }
      responses:
        '200':
          description: Assigned; assignee notified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }

  /alerts/{id}/acknowledge:
    post:
      tags: [Alerts]
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '409': { $ref: '#/components/responses/Conflict' }

  /alerts/{id}/resolve:
    post:
      tags: [Alerts]
      operationId: resolveAlert
      summary: Resolve an alert and record the outcome
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, examples: ['Watered plant; soil moisture recovered'] }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }

  /alerts/{id}/notes:
    get:
      tags: [Alerts]
      operationId: listAlertNotes
      summary: List notes on an alert
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertNote' }
    post:
      tags: [Alerts]
      operationId: addAlertNote
      summary: Add a note to an alert
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertNote' }

  # ------------------------------------------------------------- Discussions
  /discussions:
    post:
      tags: [Discussions]
      operationId: createDiscussion
      summary: Start a discussion thread (any staff role)
      description: |
        Works like email. `share_users` and `share_roles` are the people and
        role groups it is sent to; they are notified. A `private` thread can be
        read only by its owner and that audience, so it needs at least one
        person or group. A `public` thread can be read and replied to by every
        signed-in staff member. `mentions` are people tagged in the first post;
        each is notified only if they can read the thread. Sending the same
        `id` again returns the saved thread with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid, description: 'Client-made id, so a retry is safe' }
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1, maxLength: 5000 }
                visibility: { type: string, enum: [public, private], default: private }
                share_users: { type: array, maxItems: 100, items: { type: string, format: uuid } }
                share_roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
                mentions: { type: array, maxItems: 20, items: { type: string, format: uuid } }
                observation_id: { type: [string, 'null'], format: uuid, description: The field record it is about (optional) }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '200':
          description: Already saved (same id sent again)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /discussions/{id}:
    get:
      tags: [Discussions]
      operationId: getDiscussion
      summary: One thread with its audience and posts
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Discussions]
      operationId: updateDiscussion
      summary: Change title, visibility or audience (owner only)
      description: >
        Fields left out stay as they are. `share_users` and `share_roles`
        replace the current lists; only people and groups that are new get a
        notification.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                visibility: { type: string, enum: [public, private] }
                share_users: { type: array, maxItems: 100, items: { type: string, format: uuid } }
                share_roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
      responses:
        '200':
          description: Updated thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discussion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Discussions]
      operationId: deleteDiscussion
      summary: Delete a thread and its posts (owner or admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /discussions/{id}/posts:
    post:
      tags: [Discussions]
      operationId: addDiscussionPost
      summary: Reply to a thread you can read
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                body: { type: string, minLength: 1, maxLength: 5000 }
                mentions: { type: array, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscussionPost' }
        '200':
          description: Already saved (same id sent again)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscussionPost' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ----------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the logged-in user's notifications
      parameters:
        - name: unread_only
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The user's notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Marked read }

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      responses:
        '204': { description: All marked read }

  # ----------------------------------------------------------------- Reports
  # Each report is one GET that returns a downloadable file. The response
  # carries a Content-Disposition header so browsers save it with a filename.
  /reports/observations:
    get:
      tags: [Reports]
      operationId: exportObservationReport
      summary: Export observation records as a file (officer/admin)
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
        - name: from
          in: query
          description: Only observations made on or after this time
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only observations made before this time
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ObservationStatus' }
        - name: species_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/ReportFile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/species:
    get:
      tags: [Reports]
      operationId: exportSpeciesReport
      summary: Export the species catalogue with specimen counts (officer/admin)
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
        - name: conservation_status
          in: query
          schema: { type: string }
        - name: family
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ReportFile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------------------------------------------------- Map
  /distribution:
    get:
      tags: [Map]
      operationId: getDistribution
      summary: Plant locations for the distribution map (staff)
      description: >
        One point per plant, from its latest approved observation. For an endangered
        plant (species status endangered / critically endangered, or the specimen's
        endangered_override), roles other than Officer and Admin get the centre of a
        0.01 degree grid square (about 1.1 km) instead of the exact spot. The
        reduction happens in the API; the exact values are never sent (threat T13).
        Botanists only see their own observations (RLS).
      parameters:
        - name: species_id
          in: query
          schema: { type: string, format: uuid }
        - name: family
          in: query
          description: Exact family name, any case
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Map points
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DistributionPoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token
    sensorKey:
      type: apiKey
      in: header
      name: X-Sensor-Key
      description: Per-device key for sensor nodes

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QrId:
      name: qrId
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      description: Part of the scientific or common name, any case. Letters, numbers, spaces and . ' - × only
      schema: { type: string, maxLength: 100, pattern: "^[\\p{L}\\p{N} .'\\-×]+$" }
    Family:
      name: family
      in: query
      description: Exact family name, any case
      schema: { type: string, maxLength: 100, pattern: "^[\\p{L}\\p{N} .'\\-×]+$" }
    ConservationStatus:
      name: conservation_status
      in: query
      description: Exact conservation status, any case
      schema: { type: string, maxLength: 100, pattern: "^[\\p{L}\\p{N} .'\\-×]+$" }
    CreatedFrom:
      name: created_from
      in: query
      description: Added on or after this day (UTC)
      schema: { type: string, format: date }
    CreatedTo:
      name: created_to
      in: query
      description: Added on or before this day (UTC)
      schema: { type: string, format: date }
    ReportFormat:
      name: format
      in: query
      schema: { type: string, enum: [csv, pdf], default: csv }

  responses:
    ReportFile:
      description: The report as a file download
      headers:
        Content-Disposition:
          schema: { type: string, examples: ['attachment; filename="observations-2026-10-08.csv"'] }
      content:
        text/csv:
          schema: { type: string }
        application/pdf:
          schema: { type: string, format: binary }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Logged in but your role is not allowed to do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (or not visible to you)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with the current state (duplicate, stale version, wrong status)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EmailRateLimit:
      description: >
        EMAIL_RATE_LIMIT: Supabase's email limit for the project is reached and
        no email was sent. `details` is an EmailLimit with the wait. Admins also
        get an `email_rate_limit` notification.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyAttempts:
      description: TOO_MANY_ATTEMPTS (wait a few minutes)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthUnavailable:
      description: AUTH_ERROR (Supabase Auth did not answer as expected; try again)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---------- shared
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: ['VERSION_CONFLICT'] }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    Session:
      type: object
      required: [access_token, refresh_token, expires_at, user]
      properties:
        access_token: { type: string, description: Send as the Bearer token }
        refresh_token: { type: string, description: 'Single use, for POST /auth/refresh' }
        expires_at: { type: integer, description: 'When the access token expires, in seconds since 1970' }
        expires_in: { type: integer, description: Seconds until it expires }
        token_type: { type: string, const: bearer }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    UploadRequest:
      type: object
      required: [content_type, size_bytes]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size_bytes: { type: integer, maximum: 10485760 }

    UploadTicket:
      type: object
      description: Signed URL the client PUTs the file to
      properties:
        url: { type: string, format: uri }
        method: { type: string, const: PUT }
        expires_at: { type: string, format: date-time }

    # ---------- enums
    Role:
      type: string
      enum: [botanist, officer, admin]
    QrTagStatus:
      type: string
      enum: [unassigned, assigned, damaged, retired]
    ObservationStatus:
      type: string
      enum: [draft, queued, synced, returned, approved, rejected]
    ReviewDecision:
      type: string
      enum: [approve, return, reject]
    Severity:
      type: string
      enum: [low, medium, high, critical]
    AlertStatus:
      type: string
      enum: [open, acknowledged, resolved]
    NotificationType:
      type: string
      enum: [review_returned, review_approved, review_rejected, comment_reply, alert_assigned, alert_created,
             observation_submitted, observation_resubmitted, discussion_shared, discussion_post, discussion_mention,
             email_rate_limit]

    # ---------- profiles
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: [string, 'null'] }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }
        deleted_at: { type: [string, 'null'], format: date-time, description: Set while deleted; removed for good 30 days later }
        deleted_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EmailLimit:
      type: object
      properties:
        limit: { type: integer, description: 'Emails allowed per hour (EMAIL_RATE_LIMIT_PER_HOUR, 2 by default)' }
        sent_last_hour: { type: integer, description: Emails this API sent in the last hour }
        wait_minutes: { type: integer, description: How long until the next email should be allowed }
        estimated: { type: boolean, description: 'true when nothing is on record, so wait_minutes is the longest it can be (60)' }

    ProfileUpdate:
      type: object
      properties:
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }

    # ---------- qr tags
    QrTag:
      type: object
      properties:
        qr_id: { type: string }
        status: { $ref: '#/components/schemas/QrTagStatus' }
        batch_label: { type: [string, 'null'] }
        specimen_id:
          type: [string, 'null']
          format: uuid
          description: Filled when the tag is attached to a specimen
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    # ---------- species
    ConservationStatusValue:
      description: IUCN Red List category. Any case is accepted; it is stored lower case.
      type: [string, 'null']
      enum: ['least concern', 'near threatened', 'vulnerable', 'endangered', 'critically endangered',
        'extinct in the wild', 'extinct', 'data deficient', 'not evaluated', null]

    SpeciesInput:
      type: object
      required: [scientific_name]
      properties:
        scientific_name: { type: string, minLength: 1, maxLength: 200 }
        common_name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        family: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        genus: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 5000 }
        conservation_status: { $ref: '#/components/schemas/ConservationStatusValue' }
        cultural_significance: { type: [string, 'null'], minLength: 1, maxLength: 5000 }

    SpeciesCreate:
      description: Unknown fields (is_published, created_by, ...) are rejected with 422
      allOf:
        - $ref: '#/components/schemas/SpeciesInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Optional client-generated id, used as the idempotency key
      unevaluatedProperties: false

    SpeciesUpdate:
      description: Send only the fields to change, at least one. Unknown fields are rejected with 422
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        scientific_name: { type: string, minLength: 1, maxLength: 200 }
        common_name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        family: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        genus: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 5000 }
        conservation_status: { $ref: '#/components/schemas/ConservationStatusValue' }
        cultural_significance: { type: [string, 'null'], minLength: 1, maxLength: 5000 }

    Species:
      allOf:
        - $ref: '#/components/schemas/SpeciesInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            is_published: { type: boolean }
            is_deleted: { type: boolean }
            created_by: { type: string, format: uuid }
            updated_by: { type: [string, 'null'], format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    PublicSpecies:
      type: object
      description: Visitor view — no internal or location fields
      properties:
        id: { type: string, format: uuid }
        scientific_name: { type: string }
        common_name: { type: [string, 'null'] }
        family: { type: [string, 'null'] }
        genus: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        conservation_status: { type: [string, 'null'] }
        cultural_significance: { type: [string, 'null'] }
        primary_image_url: { type: [string, 'null'], format: uri }
        media:
          type: array
          items: { $ref: '#/components/schemas/SpeciesMedia' }

    PublicPlant:
      type: object
      description: Visitor view of one tagged plant — no internal fields
      properties:
        qr_id: { type: string }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        location_reduced: { type: boolean, description: True for an endangered plant; the point is a 0.01 degree grid centre }
        species: { $ref: '#/components/schemas/PublicSpecies' }

    SpeciesMedia:
      type: object
      properties:
        id: { type: string, format: uuid }
        species_id: { type: string, format: uuid }
        url: { type: string, format: uri, description: Public URL from species-media bucket }
        caption: { type: [string, 'null'] }
        credit: { type: [string, 'null'] }
        is_primary: { type: boolean }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }

    DistributionPoint:
      type: object
      properties:
        observation_id: { type: string, format: uuid }
        specimen_id: { type: string, format: uuid }
        qr_id: { type: string }
        species_id: { type: [string, 'null'], format: uuid }
        scientific_name: { type: [string, 'null'] }
        common_name: { type: [string, 'null'] }
        family: { type: [string, 'null'] }
        conservation_status: { type: [string, 'null'] }
        endangered: { type: boolean }
        observed_at: { type: string, format: date-time }
        lat: { type: number, description: "Exact, or the grid-square centre when location_reduced" }
        lng: { type: number, description: "Exact, or the grid-square centre when location_reduced" }
        location_reduced: { type: boolean }
        precision_m: { type: [number, 'null'], description: "GPS accuracy, or 1100 when location_reduced" }

    # ---------- specimens
    SpecimenCreate:
      type: object
      required: [qr_id, lat, lng]
      properties:
        qr_id: { type: string }
        species_id: { type: [string, 'null'], format: uuid }
        proposed_species_name: { type: string, description: "Botanist's field guess if species unknown" }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        gps_accuracy_m: { type: number, minimum: 0 }

    SpecimenUpdate:
      type: object
      properties:
        species_id: { type: [string, 'null'], format: uuid }
        proposed_species_name: { type: string }
        lat: { type: number }
        lng: { type: number }
        gps_accuracy_m: { type: number }
        endangered_override: { type: boolean }

    Specimen:
      type: object
      properties:
        id: { type: string, format: uuid }
        qr_id: { type: string }
        species_id: { type: [string, 'null'], format: uuid }
        proposed_species_name: { type: [string, 'null'] }
        registered_by: { type: string, format: uuid }
        lat: { type: [number, 'null'], description: Null when no GPS fix was captured }
        lng: { type: [number, 'null'] }
        gps_accuracy_m: { type: [number, 'null'] }
        zone_id:
          type: [string, 'null']
          description: >
            The 0.01 degree grid square the plant is in, set by the database
            from its GPS (GET /workspace only). Null with no GPS fix. It is the
            same square as a reduced location, so it reveals nothing more.
        endangered_override: { type: boolean }
        location_reduced:
          type: boolean
          description: >
            True when lat/lng were snapped to the 0.01 degree grid because the
            plant is endangered and the caller may not see its exact spot
            (GET /workspace, GET /specimens/by-qr/{qrId}; threat T13).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- observations
    ObservationCreate:
      type: object
      required: [specimen_id, observed_at]
      properties:
        id:
          type: string
          format: uuid
          description: Optional client-generated id (for offline-first creation)
        specimen_id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        height_cm: { type: number, minimum: 0 }
        morphology: { type: string }
        notes: { type: string }
        lat: { type: number }
        lng: { type: number }
        gps_accuracy_m: { type: number }
        device_id: { type: string }

    ObservationUpdate:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: The version you last saw; server rejects with 409 if it changed
        height_cm: { type: number, minimum: 0 }
        morphology: { type: string }
        notes: { type: string }
        lat: { type: number }
        lng: { type: number }
        gps_accuracy_m: { type: number }

    Observation:
      type: object
      properties:
        id: { type: string, format: uuid }
        specimen_id: { type: string, format: uuid }
        recorded_by: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        height_cm: { type: [number, 'null'] }
        morphology: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        gps_accuracy_m: { type: [number, 'null'] }
        status: { $ref: '#/components/schemas/ObservationStatus' }
        version: { type: integer }
        device_id: { type: [string, 'null'] }
        last_synced_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ObservationPhoto:
      type: object
      properties:
        id: { type: string, format: uuid }
        observation_id: { type: string, format: uuid }
        s3_bucket: { type: string, examples: ['observation-photos'] }
        s3_key: { type: string, examples: ['<observation_id>/<photo_id>.jpg'] }
        content_type: { type: string }
        size_bytes: { type: integer }
        upload_status: { type: string, enum: [pending, uploaded, failed] }
        caption: { type: [string, 'null'], maxLength: 200, description: Staff only. Not returned to visitors. }
        traits:
          type: array
          description: What the photo shows. Staff only. Not returned to visitors.
          items: { type: string, enum: [Whole plant, Tree trunk, Bark, Leaf, Flower, Fruit, Seed, Root] }
        view_url:
          type: [string, 'null']
          format: uri
          description: Short-lived signed URL (private bucket)
        created_at: { type: string, format: date-time }

    # ---------- reviews & comments
    ReviewCreate:
      type: object
      required: [decision, observation_version]
      additionalProperties: false
      properties:
        decision: { $ref: '#/components/schemas/ReviewDecision' }
        observation_version: { type: integer, minimum: 1, description: Version the reviewer looked at }
        comment: { type: string, minLength: 1, maxLength: 2000, description: The reason. Required when decision is return or reject }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        observation_id: { type: string, format: uuid }
        reviewer_id: { type: string, format: uuid }
        observation_version: { type: integer }
        decision: { $ref: '#/components/schemas/ReviewDecision' }
        comment: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        observation_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }

    DbLoad:
      type: object
      properties:
        state: { type: string, enum: [free, normal, busy, very busy, overloaded] }
        latency_ms: { type: [integer, 'null'], description: Moving average of recent database calls }
        in_flight: { type: integer }
        poll_after_ms: { type: integer, minimum: 5000, maximum: 60000 }

    # ---------- discussions
    Discussion:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        owner_id: { type: string, format: uuid }
        visibility: { type: string, enum: [public, private] }
        observation_id: { type: [string, 'null'], format: uuid }
        last_post_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        audience:
          type: array
          items:
            type: object
            description: One person (user_id) or one role group (role)
            properties:
              id: { type: string, format: uuid }
              discussion_id: { type: string, format: uuid }
              user_id: { type: [string, 'null'], format: uuid }
              role: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
        posts:
          type: array
          items: { $ref: '#/components/schemas/DiscussionPost' }
    DiscussionPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        discussion_id: { type: string, format: uuid }
        author_id: { type: [string, 'null'], format: uuid }
        body: { type: string }
        mentions: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }

    # ---------- sync
    SyncRequest:
      type: object
      required: [device_id, observations]
      properties:
        device_id: { type: string }
        observations:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ObservationCreate'
              - type: object
                properties:
                  base_version:
                    type: [integer, 'null']
                    description: Version the device edited from (null if new)

    SyncResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              result: { type: string, enum: [created, updated, conflict, error] }
              server_version: { type: integer }
              error: { $ref: '#/components/schemas/Error' }

    # ---------- sensors
    SensorNodeInput:
      type: object
      properties:
        specimen_id: { type: string, format: uuid }
        status: { type: string, enum: [active, offline, maintenance, retired] }
        lat: { type: number, minimum: -90, maximum: 90, description: Where the node was installed }
        lng: { type: number, minimum: -180, maximum: 180 }
        thresholds:
          type: object
          description: Readings outside these limits create an alert
          properties:
            temperature_min: { type: number }
            temperature_max: { type: number }
            humidity_min: { type: number }
            humidity_max: { type: number }
            soil_moisture_min: { type: number }
            soil_moisture_max: { type: number }
            distance_change_cm:
              type: number
              minimum: 0
              description: Server-side check. Alert when distance_cm changes by more than this between two stored readings

    SensorNode:
      allOf:
        - $ref: '#/components/schemas/SensorNodeInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            last_seen: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    TelemetryReadingInput:
      type: object
      description: |
        One reading from a node. This is also the MQTT payload. Only `ts` is
        required, so a node sends just the sensors it has.
      required: [ts]
      properties:
        ts: { type: string, format: date-time }
        temperature: { type: number, description: Degrees Celsius (DHT11) }
        humidity: { type: number, minimum: 0, maximum: 100, description: Relative humidity in percent (DHT11) }
        soil_moisture: { type: number, minimum: 0, maximum: 100, description: 'Percent, converted on the node from the YL-69 analogue reading' }
        distance_cm:
          type: number
          minimum: 0
          description: HC-SR04 distance to the nearest object, in centimetres. Omit the field if the sensor timed out.
        motion_detected:
          type: boolean
          description: True if the HC-SR04 distance changed by more than the node's threshold since the last reading
        lat: { type: number, minimum: -90, maximum: 90, description: Only for nodes with a GPS module. The current node has none. }
        lng: { type: number, minimum: -180, maximum: 180 }

    TelemetryReading:
      type: object
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        temperature: { type: [number, 'null'] }
        humidity: { type: [number, 'null'] }
        soil_moisture: { type: [number, 'null'] }
        distance_cm: { type: [number, 'null'] }
        motion_detected: { type: [boolean, 'null'] }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }

    SensorImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        alert_id:
          type: [string, 'null']
          format: uuid
          description: Set when the image was captured as evidence for an alert
        captured_at: { type: string, format: date-time }
        s3_bucket: { type: string, examples: ['sensor-images'] }
        s3_key: { type: string, examples: ['<node_id>/<image_id>.jpg'] }
        size_bytes: { type: integer }
        view_url:
          type: [string, 'null']
          format: uri
          description: Short-lived signed URL (private bucket)
        created_at: { type: string, format: date-time }

    # ---------- alerts
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        type: { type: string, examples: ['soil_moisture_low'] }
        reading: { type: object, additionalProperties: true }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        assigned_to: { type: [string, 'null'], format: uuid }
        acknowledged_by: { type: [string, 'null'], format: uuid }
        acknowledged_at: { type: [string, 'null'], format: date-time }
        resolved_by: { type: [string, 'null'], format: uuid }
        resolved_at: { type: [string, 'null'], format: date-time }
        outcome: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    AlertNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        alert_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        note: { type: string }
        created_at: { type: string, format: date-time }

    # ---------- notifications
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: [string, 'null'] }
        body: { type: [string, 'null'] }
        related_table: { type: [string, 'null'], examples: ['observations'] }
        related_id: { type: [string, 'null'] }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
